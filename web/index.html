<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sistema de Colaborador</title>
        <link rel="stylesheet" href="./src/styles/style.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>
    <body>
        
        <header>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <h2>Registro de Ponto</h2>
        </header>

        <div class="container">
            <svg class="main-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                <polyline points="21 3 21 8 16 8"/>
                <polyline points="12 8 12 12 15 15"/>
            </svg>
            <div>
                <h3 id="greeting">Bom Dia</h3>
                <h2>Colaborador</h2>
            </div>

            <div>
                <p class="date" id="date">Carregando ...</p>
                <h1 class="time" id="time">Carregando ...</h1>
            </div>

            <div id="welcome" class="section">

                <div id="registryListContainer" class="startsHide">
                    <ul id="registryList"></ul>
                </div>
    
                <div id="wait">
                    <p>Aguardando Ponto</p>
                </div>
                
                <button id="register">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                    Registrar
                </button>

            </div>

            <div id="location" class="section startsHide">
                <h2>Obtenha sua localizaçao</h2>
                <iframe id="map" width="100%" height="300" frameborder="0" style="border:0" src="https://www.google.com/maps/embed/v1/view?key=AIzaSyDC5LhWdCNMAzH-Nix9RFTwC5AfRyx8ZLc&center=-29.5709306,-50.7964862&zoom=15" allowfullscreen></iframe>
                <p id="isNotMobile" class="startsHide">Devido ao uso de desktop, a localização pode não funcionar corretamente.</p>
                <button id="confirmLocation">Confirmar</button>
            </div>
    
            <div id="photo" class="section startsHide">
                <h2>Capture sua foto</h2>
                <video id="video" autoplay></video>
                <canvas id="canvas" class="startsHide"></canvas>
                <button id="capturePhoto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    Capturar Foto
                </button>
            </div>

        </div>

        <script type="module" src="./src/script/utils.js"></script>
        <script type="module" src="./src/script/script.js"></script>
    </body>
</html>
